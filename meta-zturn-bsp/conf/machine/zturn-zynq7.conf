#@TYPE: Machine
#@NAME: zturn-zynq7
#@DESCRIPTION: Machine support for MYIR Z-Turn (Zynq-7000) with custom HDMI PL

require conf/machine/zynq-generic.conf

# Используем ваш внешний Device Tree
KERNEL_DEVICETREE = ""
PREFERRED_PROVIDER_virtual/dtb = "device-tree"

# Провайдеры внешнего FSBL и Bitstream
PREFERRED_PROVIDER_virtual/fsbl = "fsbl"
PREFERRED_PROVIDER_fsbl = "fsbl"
PREFERRED_PROVIDER_virtual/bitstream = "bitstream-zturn"

# Конфигурация U-Boot для Z-Turn
UBOOT_MACHINE = "xilinx_zynq_virt_defconfig"

# Генерируем BOOT.BIN через xilinx-bootbin
SPL_BINARY = ""
EXTRA_IMAGEDEPENDS += "xilinx-bootbin"

BIF_COMMON_ATTR = ""
BIF_PARTITION_ATTR = "fsbl bitstream u-boot-xlnx"

BIF_PARTITION_ATTR[fsbl] = "bootloader"
BIF_PARTITION_IMAGE[fsbl] = "${DEPLOY_DIR_IMAGE}/fsbl-${MACHINE}.elf"
BIF_PARTITION_DEPENDS[fsbl] = "fsbl:do_deploy"

BIF_PARTITION_ATTR[bitstream] = ""
BIF_PARTITION_IMAGE[bitstream] = "${DEPLOY_DIR_IMAGE}/bitstream-${MACHINE}.bit"
BIF_PARTITION_DEPENDS[bitstream] = "bitstream-zturn:do_deploy"

BIF_PARTITION_ATTR[u-boot-xlnx] = ""
BIF_PARTITION_IMAGE[u-boot-xlnx] = "${DEPLOY_DIR_IMAGE}/u-boot.elf"
BIF_PARTITION_DEPENDS[u-boot-xlnx] = "virtual/bootloader:do_deploy"

# Файлы для раздела BOOT на SD-карте
IMAGE_BOOT_FILES = " \
    boot.bin \
    zynq-zturn.dtb \
    boot.scr \
"
CONFIG_DTFILE = "${LAYERDIR}/recipes-bsp/device-tree/files/zynq-zturn.dts"

