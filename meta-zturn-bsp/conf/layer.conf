BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "zturn-bsp"
BBFILE_PATTERN_zturn-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_zturn-bsp = "6"

LAYERDEPENDS_zturn-bsp = "core xilinx"
LAYERSERIES_COMPAT_zturn-bsp = "scarthgap styhead walnascar"

